$ModLoad imudp.so

# http://www.rsyslog.com/doc/v8-stable/configuration/templates.html
$template SimpleFormat,"%msg%\n"

$MaxMessageSize 20k
$UDPServerRun 514

# /proc/self/fd/2 links to the container's stderr. rsyslog 8.2608 and later refuse to open a link as an output file
# unless the action allows it.
*.* action(type="omfile" file="/proc/self/fd/2" template="SimpleFormat" followSymlinks="on")
